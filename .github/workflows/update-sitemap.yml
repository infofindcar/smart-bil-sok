name: Uppdatera sitemap

on:
  # Manuell körning: GitHub UI > Actions > Uppdatera sitemap > Run workflow
  workflow_dispatch:

jobs:
  sitemap:
    name: Generera sitemap.xml
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generera sitemap
        run: node scripts/generate-sitemap.js

      - name: Committa och pusha sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git diff --staged --quiet && echo "Ingen ändring i sitemap" || (
            git commit -m "Uppdatera sitemap.xml ($(date -u +%Y-%m-%d))" &&
            git push
          )
