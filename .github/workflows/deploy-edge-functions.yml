name: Deploya Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    name: Deploya till Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Installera Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploya edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in sync-cars enrich-from-blocket detect-colors enrich-batch \
                    guided-search verify-password verify-admin-password \
                    enrich-car-data add-to-waitlist track-analytics; do
            supabase functions deploy $fn \
              --project-ref bvqveqoschdpenvbxygj \
              --no-verify-jwt
          done
