name: Deploya Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    name: Deploya till Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Installera Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploya edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in sync-cars guided-search enrich-batch enrich-car-data \
                    track-analytics verify-admin-password verify-password \
                    add-to-waitlist; do
            echo "::group::Deploya $fn"
            supabase functions deploy "$fn" \
              --project-ref bvqveqoschdpenvbxygj \
              --no-verify-jwt
            echo "::endgroup::"
          done
