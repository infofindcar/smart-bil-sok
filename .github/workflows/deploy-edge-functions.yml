name: Deploya Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    name: Deploya till Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Installera Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploya edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-cars \
            --project-ref bvqveqoschdpenvbxygj \
            --no-verify-jwt
