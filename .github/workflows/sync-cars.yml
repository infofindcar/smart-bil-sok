name: Daglig bilsynkronisering

on:
  # PAUSAD – avkommentera schedule-blocket nedan för att aktivera nattlig körning igen
  # schedule:
  #   - cron: "0 4 * * *"

  # Manuell körning: GitHub UI > Actions > Daglig bilsynkronisering > Run workflow
  workflow_dispatch:

jobs:
  sync:
    name: Synkronisera billistings
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kör importscript
        env:
          SUPABASE_SYNC_URL: ${{ secrets.SUPABASE_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: node scripts/import-cars.js

      - name: Berika bilar
        env:
          SUPABASE_ENRICH_URL: ${{ secrets.SUPABASE_ENRICH_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          node -e "
          async function loop() {
            const url = process.env.SUPABASE_ENRICH_URL;
            const secret = process.env.SYNC_SECRET;
            let remaining = Infinity, calls = 0;
            while (remaining > 0 && calls < 650) {
              const r = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type':'application/json','x-sync-secret':secret},
                body: JSON.stringify({limit:50})
              });
              const d = await r.json();
              if (!d.success) { console.error('Fel:', d.error); break; }
              console.log('Batch '+(++calls)+': berikade='+d.processed+' kvar='+d.remaining);
              remaining = d.remaining;
              if (d.processed === 0) break;
            }
            console.log('Berikelse klar efter '+calls+' batchar.');
          }
          loop().catch(e=>{console.error(e);process.exit(1);});
          "
